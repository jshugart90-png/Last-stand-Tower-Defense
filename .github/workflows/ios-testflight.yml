name: iOS TestFlight

# Uploads a signed build to TestFlight. It does not submit the app for App Store review.
#
# Required secrets:
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_BASE64   (.p8, base64)
#   APPLE_TEAM_ID
#   EXPO_PUBLIC_BACKEND_URL            (inlined into the release bundle)
#
# With those four, fastlane creates or fetches the Apple Distribution certificate
# and the App Store provisioning profile (get_certificates / get_provisioning_profile)
# inside a temporary keychain. A fresh runner has no private key, so the API-key
# path mints a certificate when it cannot download one. Apple caps distribution
# certificates; the optional p12 override reuses an existing one instead.
#
# Optional override (a pair is used only when both values are set):
#   IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 + IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
#   IOS_PROVISIONING_PROFILE_BASE64 + IOS_PROVISIONING_PROFILE_NAME

on:
  workflow_dispatch:

jobs:
  testflight:
    name: iOS TestFlight
    runs-on: macos-15
    timeout-minutes: 120
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      P12_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require App Store Connect secrets
        run: |
          set -euo pipefail
          missing=0
          check() {
            local name="$1"
            local value="$2"
            local required="$3"
            if [ -n "$value" ]; then
              echo "$name: present"
            else
              echo "$name: missing"
              if [ "$required" = "required" ]; then
                missing=1
              fi
            fi
          }
          echo "Required:"
          check APP_STORE_CONNECT_API_KEY_ID "$ASC_KEY_ID" required
          check APP_STORE_CONNECT_ISSUER_ID "$ASC_ISSUER_ID" required
          check APP_STORE_CONNECT_API_KEY_BASE64 "$ASC_KEY_B64" required
          check APPLE_TEAM_ID "$APPLE_TEAM_ID" required
          check EXPO_PUBLIC_BACKEND_URL "$EXPO_PUBLIC_BACKEND_URL" required
          echo "Optional override:"
          check IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 "$P12_B64" optional
          check IOS_DISTRIBUTION_CERTIFICATE_PASSWORD "$P12_PASSWORD" optional
          check IOS_PROVISIONING_PROFILE_BASE64 "$PROFILE_B64" optional
          check IOS_PROVISIONING_PROFILE_NAME "$PROFILE_NAME" optional
          if [ -n "$P12_B64" ] && [ -z "$P12_PASSWORD" ]; then
            echo "P12 is set without IOS_DISTRIBUTION_CERTIFICATE_PASSWORD. The override will be ignored."
          fi
          if [ -z "$P12_B64" ] && [ -n "$P12_PASSWORD" ]; then
            echo "Certificate password is set without IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64. The override will be ignored."
          fi
          if [ -n "$PROFILE_B64" ] && [ -z "$PROFILE_NAME" ]; then
            echo "Profile is set without IOS_PROVISIONING_PROFILE_NAME. The override will be ignored."
          fi
          if [ -z "$PROFILE_B64" ] && [ -n "$PROFILE_NAME" ]; then
            echo "Profile name is set without IOS_PROVISIONING_PROFILE_BASE64. The override will be ignored."
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Stopping before the iOS build. Add the missing required secrets, then rerun iOS TestFlight."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: npm ci

      - name: Stamp the iOS build number
        working-directory: frontend
        run: |
          node << 'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          const run = Number(process.env.GITHUB_RUN_NUMBER || '1');
          const build = String(23000 + run);
          app.expo.version = '2.3.0';
          app.expo.ios = app.expo.ios || {};
          app.expo.ios.buildNumber = build;
          if (app.expo.android) app.expo.android.versionCode = 23000 + run;
          const backend = process.env.EXPO_PUBLIC_BACKEND_URL || '';
          app.expo.extra = app.expo.extra || {};
          app.expo.extra.EXPO_PUBLIC_BACKEND_URL = backend;
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          console.log('ios buildNumber', build);
          console.log('backend url', backend ? 'set' : 'empty');
          NODE

      - name: Write the release backend URL
        working-directory: frontend
        run: |
          set -euo pipefail
          umask 077
          printf 'EXPO_PUBLIC_BACKEND_URL=%s\n' "$EXPO_PUBLIC_BACKEND_URL" > .env
          echo "Wrote frontend/.env for the Metro release bundle."

      - name: Prebuild the iOS project
        working-directory: frontend
        run: npx expo prebuild --platform ios --no-install --non-interactive

      - name: Install CocoaPods
        working-directory: frontend/ios
        run: pod install

      - name: Prepare the temporary signing keychain
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

          if [ -n "$P12_B64" ] && [ -n "$P12_PASSWORD" ]; then
            echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
            security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            rm -f "$RUNNER_TEMP/dist.p12"
            echo "IOS_MANUAL_CERT=true" >> "$GITHUB_ENV"
            echo "Using the optional distribution certificate override."
          else
            echo "IOS_MANUAL_CERT=false" >> "$GITHUB_ENV"
            echo "No p12 override. fastlane will create or fetch the distribution certificate."
          fi

          if [ -n "$PROFILE_B64" ] && [ -n "$PROFILE_NAME" ]; then
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            echo "$PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/laststand.mobileprovision"
            {
              echo "IOS_PROFILE_NAME<<EOF"
              echo "$PROFILE_NAME"
              echo "EOF"
            } >> "$GITHUB_ENV"
            echo "Using the optional provisioning profile override."
          else
            echo "IOS_PROFILE_NAME=" >> "$GITHUB_ENV"
            echo "No profile override. fastlane will create or fetch the App Store profile."
          fi

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Build and upload to TestFlight
        working-directory: frontend
        run: |
          set -euo pipefail
          export ASC_KEY_CONTENT="$ASC_KEY_B64"
          export ASC_KEY_IS_BASE64=true
          fastlane ios testflight
