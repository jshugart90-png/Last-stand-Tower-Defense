name: iOS simulator screenshots

# Release simulator build and portrait screenshots. Not an App Store upload.
# The bundle sets EXPO_PUBLIC_PROOF_BATTLE=1 so deep links can open demo screens.
# Store builds do not set that flag.

on:
  workflow_dispatch:

jobs:
  screenshots:
    name: iOS simulator screenshots
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: npm ci

      - name: Enable screenshot deep links
        working-directory: frontend
        run: |
          set -euo pipefail
          umask 077
          printf 'EXPO_PUBLIC_PROOF_BATTLE=1\n' > .env
          echo "EXPO_PUBLIC_PROOF_BATTLE=1" >> "$GITHUB_ENV"

      - name: Prebuild the iOS project
        working-directory: frontend
        run: npx expo prebuild --platform ios --no-install --non-interactive

      - name: Install CocoaPods
        working-directory: frontend/ios
        run: pod install

      - name: Build a Release simulator app
        working-directory: frontend/ios
        run: |
          set -euo pipefail
          WS="$(ls -d *.xcworkspace | head -n 1)"
          SCHEME="$(xcodebuild -workspace "$WS" -list -json | python3 -c 'import json,sys; data=json.load(sys.stdin); schemes=data.get("workspace", data.get("project", {})).get("schemes", []); print(next(s for s in schemes if s != "Pods"))')"
          echo "Scheme: $SCHEME"
          echo "Workspace: $WS"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP="$(find "$RUNNER_TEMP/sim-dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "Built $APP"

      - name: Capture screenshots
        run: |
          set -euo pipefail
          BUNDLE="com.horseshoeroundme.laststandtowerdefense"
          ROOT="$RUNNER_TEMP/sim-screenshots"
          mkdir -p "$ROOT"

          pick() {
            PATTERN="$1" python3 -c 'import json,os,subprocess,sys; pattern=os.environ["PATTERN"].lower(); data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]));
found=False
for runtime in sorted(data.get("devices", {}), reverse=True):
    for device in data["devices"][runtime]:
        if not device.get("isAvailable", True):
            continue
        name=device.get("name", "")
        if pattern in name.lower():
            print(device["udid"]); print(name, file=sys.stderr); found=True; break
    if found:
        break
sys.exit(0 if found else 1)'
          }

          IPAD13="$(pick "ipad pro 13-inch (m4)" || pick "ipad pro 13-inch")"
          IPAD11="$(pick "ipad pro 11-inch (m4)" || pick "ipad pro 11-inch")"
          IPHONE="$(pick "iphone 17 pro max" || pick "iphone 16 pro max")"
          echo "iPad 13: $IPAD13"
          echo "iPad 11: $IPAD11"
          echo "iPhone: $IPHONE"

          capture_device() {
            local udid="$1"
            local folder="$2"
            local out="$ROOT/$folder"
            mkdir -p "$out"
            xcrun simctl shutdown all || true
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl ui "$udid" orientation portrait || true
            xcrun simctl install "$udid" "$APP_PATH"
            shot() {
              local name="$1"
              local url="$2"
              local wait="$3"
              xcrun simctl terminate "$udid" "$BUNDLE" || true
              xcrun simctl openurl "$udid" "$url"
              sleep "$wait"
              xcrun simctl io booted screenshot "$out/$name.png"
            }
            shot home "laststandtd:///" 25
            shot arena "laststandtd:///shop?tab=arena" 18
            shot freeplay-10x14 "laststandtd:///game?proof=classic&size=0" 20
            shot freeplay-16x20 "laststandtd:///game?proof=classic&size=3" 20
            shot painted-boss "laststandtd:///game?proof=ash_pass" 22
            shot maps "laststandtd:///map-selection" 18
            xcrun simctl shutdown "$udid" || true
          }

          capture_device "$IPAD13" "ipad-13"
          capture_device "$IPAD11" "ipad-11"
          capture_device "$IPHONE" "iphone-6.9"

          find "$ROOT" -name '*.png' -print
          test "$(find "$ROOT" -name '*.png' | wc -l | tr -d ' ')" -eq 18

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sim-screenshots
          path: ${{ runner.temp }}/sim-screenshots
          if-no-files-found: error
